name: news-pipeline
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: news-pipeline, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install firebase-admin
      - run: python pipeline/tests/test_core.py
      - run: python pipeline/main.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: |
          git config user.name "newsroom-bot"; git config user.email "bot@users.noreply.github.com"
          git add site; git diff --cached --quiet || (git commit -m "publish pages" && git push)
